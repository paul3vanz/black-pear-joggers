info:
  name: Archive an award claim
  type: http
  seq: 5
  tags:
    - AwardClaims

http:
  method: POST
  url: "{{baseUrl}}/awardclaim/archive/:id"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
