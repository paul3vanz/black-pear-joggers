info:
  name: Delete an athlete
  type: http
  seq: 3
  tags:
    - Athletes

http:
  method: DELETE
  url: "{{baseUrl}}/athlete/:id"
  params:
    - name: id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 204 Response
    description: No content
    request:
      url: "{{baseUrl}}/athlete/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 403 Response
    description: Forbidden
    request:
      url: "{{baseUrl}}/athlete/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""
