info:
  name: Get parkrun alphabet/challenge progress for a year
  type: http
  seq: 1
  tags:
    - Parkrun

http:
  method: GET
  url: "{{baseUrl}}/parkrun/alphabet"
  params:
    - name: year
      value: ""
      type: query
    - name: challenge
      value: ""
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/parkrun/alphabet"
      method: GET
      params:
        - name: year
          value: ""
          type: query
        - name: challenge
          value: ""
          type: query
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
