info:
  name: Get all UKA clubs
  type: http
  seq: 3
  tags:
    - Membership

http:
  method: GET
  url: "{{baseUrl}}/clubs"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/clubs"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: 403 Response
    description: Forbidden
    request:
      url: "{{baseUrl}}/clubs"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""
